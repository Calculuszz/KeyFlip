<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HAPPY ELDER HAPPY US | Catalog</title>
<style>
  :root{
    --bg:#0b0c0f;
    --card:#14161b;
    --text:#e8eaf0;
    --muted:#a9afbf;
    --brand:#6ee7b7;
    --accent:#60a5fa;
    --chip:#1d212a;
    --chip-active:#2a3342;
    --border:#232733;
    --danger:#f87171;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f7f8fb; --card:#fff; --text:#0d1321; --muted:#4b5563;
      --brand:#059669; --accent:#2563eb; --chip:#eef2ff; --chip-active:#e0e7ff; --border:#e5e7eb;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial;
  }
  .container{max-width:1200px;margin:auto;padding:20px}
  header{display:grid;gap:16px;align-items:center;margin-bottom:16px}
  @media(min-width:860px){
    header{grid-template-columns:1fr auto auto auto;gap:12px}
  }
  .brand{font-weight:800;letter-spacing:.2px;font-size:22px}
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    padding:10px 12px;border-radius:10px;flex:1;min-width:220px;
  }
  .search input{all:unset;flex:1;color:var(--text)}
  select, .btn, .chip{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:10px;font:inherit
  }
  select{min-width:180px}
  .toggle{cursor:pointer}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .chip{
    background:var(--chip);border:none;color:var(--text);cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--chip-active);outline:2px solid var(--accent)}
  .levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .level{padding:6px 10px;border-radius:8px;border:1px solid var(--border);cursor:pointer}
  .level[aria-pressed="true"]{background:var(--chip-active);outline:2px solid var(--brand)}
  .grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:14px}
  @media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column
  }
  .thumb{aspect-ratio:16/9;background:#000;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}
  .badge{
    position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;
    padding:4px 8px;border-radius:999px
  }
  .card-body{padding:14px;display:flex;flex-direction:column;gap:10px}
  .title{font-weight:700}
  .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
  .modes{display:flex;gap:8px;flex-wrap:wrap}           /* ✅ แสดงสถานะคอร์ส */
  .mode{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--chip);padding:6px 10px;border-radius:999px;font-size:13px
  }
  .mode .detail{color:var(--muted);font-size:12px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;background:var(--chip);padding:4px 8px;border-radius:999px;color:var(--muted)}
  .price{display:flex;align-items:baseline;gap:8px}
  .price .now{font-weight:800}
  .price .old{color:var(--muted);text-decoration:line-through}
  .cta{margin-top:auto;display:flex;gap:8px}
  .btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--brand));color:#0b0c0f;border:none;font-weight:700}
  .btn.ghost{background:transparent;border:1px dashed var(--border);color:var(--muted)}
  .rating{display:inline-flex;align-items:center;gap:6px;color:#fbbf24}
  .empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;background:var(--card)}
  .pagination{display:flex;align-items:center;gap:8px;justify-content:center;margin:18px 0}
  .page-btn{padding:8px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer}
  .page-btn[disabled]{opacity:.4;cursor:not-allowed}
  .page-info{color:var(--muted);font-size:14px}
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">🎓 HAPPY ELDER HAPPY US</div>
      <div class="search" role="search">
        <span aria-hidden="true">🔎</span>
        <input id="q" type="search" placeholder="ค้นหา: ชื่อคอร์ส, ผู้สอน, แท็ก..." aria-label="ค้นหาคอร์ส" />
      </div>
      <select id="sort" aria-label="จัดเรียง">
        <option value="popular">จัดเรียง: ยอดนิยม</option>
        <option value="newest">ใหม่ล่าสุด</option>
        <option value="rating">คะแนนสูงสุด</option>
        <option value="price-asc">ราคาต่ำไปสูง</option>
        <option value="price-desc">ราคาสูงไปต่ำ</option>
      </select>
      <button id="theme" class="btn toggle" aria-pressed="false" title="สลับโหมด">🌓 โหมด</button>
    </header>

    <div class="filters" id="categoryChips" aria-label="หมวดหมู่"></div>
    <div class="levels" id="levelChips" aria-label="ระดับความยาก"></div>

    <main>
      <section id="grid" class="grid" aria-live="polite"></section>
      <div id="empty" class="empty" hidden>ไม่พบคอร์สตามเงื่อนไขที่เลือก ลองเปลี่ยนคำค้นหรือฟิลเตอร์ดูนะ</div>

      <nav class="pagination" aria-label="แบ่งหน้า">
        <button class="page-btn" id="prev">ก่อนหน้า</button>
        <span class="page-info" id="pageInfo">หน้า 1/1</span>
        <button class="page-btn" id="next">ถัดไป</button>
      </nav>
    </main>
  </div>

<script>
/** ====== ข้อมูลคอร์ส (เพิ่ม modes: Onsite/Online) ====== **/
const courses = [
  {
    id:1,
    title:"งานทอผ้าไหมไทย",
    instructor:"อ. เมธาวี",
    category:"ศิลปะและวัฒนธรรม",
    level:"พื้นฐาน",
    duration:"12 ชม.",
    rating:4.8,
    ratingsCount:1240,
    students:8900,
    price:1490,
    oldPrice:2990,
    thumbnail:"https://www.khaosod.co.th/wpapp/uploads/2018/03/28954046_1924900604209499_7584846028495423245_o.jpg",
    tags:[],
    badge:"ขายดี",
    released:"2025-07-10",
    modes:[
      { type:"Onsite", detail:"ศูนย์ชุมชน บางนา (เสาร์–อาทิตย์)" },
      { type:"Online", detail:"Zoom + ดูย้อนหลัง 60 วัน" }
    ]
  },
  {
    id:2,
    title:"การเย็บผ้าขาดด้วยมือและจักร",
    instructor:"ดร. ชวิน",
    category:"งานฝีมือและการซ่อมแซม",
    level:"พื้นฐาน",
    duration:"18 ชม.",
    rating:4.9,
    ratingsCount:980,
    students:5200,
    price:2790,
    oldPrice:null,
    thumbnail:"https://elvira.co.th/wp-content/uploads/2014/12/IMG_7892-560x373.jpg",
    tags:[],
    badge:"แนะนำ",
    released:"2025-05-22",
    modes:[
      { type:"Onsite", detail:"ห้องเรียนดอนเมือง (อุปกรณ์พร้อม)" }
    ]
  },
  {
    id:3,
    title:"วิธีการดูแลสุขภาพในวัย 60",
    instructor:"ครูฟ้า",
    category:"สุขภาพและการดูแลตนเอง",
    level:"พื้นฐาน",
    duration:"10 ชม.",
    rating:4.6,
    ratingsCount:700,
    students:4200,
    price:990,
    oldPrice:1690,
    thumbnail:"https://img.pptvhd36.com/health/thumbor/2024/03/11/cusArticle-bf5c573.jpg",
    tags:[],
    badge:"ลดราคา",
    released:"2025-06-30",
    modes:[
      { type:"Online", detail:"Google Meet | เอกสาร PDF ให้ดาวน์โหลด" }
    ]
  }
];

/** ====== สถานะ UI ====== **/
const state = {
  query:"",
  categories:new Set(),
  level:null,
  sort:"popular",
  page:1,
  perPage:6
};

/** ====== สร้างชิปหมวดหมู่/ระดับจากข้อมูลจริง ====== **/
const categories = [...new Set(courses.map(c=>c.category))].sort();
const levels = ["พื้นฐาน","กลาง","สูง"];

const categoryChips = document.getElementById('categoryChips');
categories.forEach(cat=>{
  const b = document.createElement('button');
  b.className='chip';
  b.textContent=cat;
  b.setAttribute('aria-pressed','false');
  b.onclick=()=>{
    if(state.categories.has(cat)){ state.categories.delete(cat); b.setAttribute('aria-pressed','false'); }
    else{ state.categories.add(cat); b.setAttribute('aria-pressed','true'); }
    state.page=1; render();
  };
  categoryChips.appendChild(b);
});

const levelChips = document.getElementById('levelChips');
levels.forEach(lv=>{
  const b=document.createElement('button');
  b.className='level';
  b.textContent=lv;
  b.setAttribute('aria-pressed','false');
  b.onclick=()=>{
    if(state.level===lv){ state.level=null; b.setAttribute('aria-pressed','false'); }
    else{
      state.level=lv;
      [...levelChips.children].forEach(el=>el.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
    }
    state.page=1; render();
  };
  levelChips.appendChild(b);
});

/** ====== ค้นหา/จัดเรียง/แบ่งหน้า ====== **/
const q = document.getElementById('q');
q.addEventListener('input', e=>{ state.query=e.target.value.trim().toLowerCase(); state.page=1; render(); });

const sort = document.getElementById('sort');
sort.addEventListener('change', e=>{ state.sort=e.target.value; state.page=1; render(); });

document.getElementById('prev').onclick=()=>{ if(state.page>1){ state.page--; render(); } };
document.getElementById('next').onclick=()=>{
  const total=filtered().length; const max=Math.max(1,Math.ceil(total/state.perPage));
  if(state.page<max){ state.page++; render(); }
};

function filtered(){
  return courses.filter(c=>{
    const s = state.query;
    const inText = (t)=>t.toLowerCase().includes(s);
    const hit = !s || inText(c.title)||inText(c.instructor)||(c.tags||[]).some(t=>inText(t));
    if(!hit) return false;
    if(state.categories.size>0 && !state.categories.has(c.category)) return false;
    if(state.level && c.level!==state.level) return false;
    return true;
  }).sort((a,b)=>{
    switch(state.sort){
      case 'newest': return new Date(b.released)-new Date(a.released);
      case 'rating': return (b.rating??0)-(a.rating??0);
      case 'price-asc': return (a.price??0)-(b.price??0);
      case 'price-desc': return (b.price??0)-(a.price??0);
      case 'popular': default: return (b.students??0)-(a.students??0);
    }
  });
}

function paginate(arr){
  const start=(state.page-1)*state.perPage;
  return arr.slice(start,start+state.perPage);
}

/** ====== Render ====== **/
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const pageInfo = document.getElementById('pageInfo');

function starSVG(){ return `<svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.6l2.4 5 5.5.8-4 3.9.9 5.6L10 14.8 5.2 16.9l.9-5.6-4-3.9 5.5-.8L10 1.6z"/></svg>`}

function cardHTML(c){
  const rating = `
    <span class="rating" aria-label="เรตติ้ง ${c.rating} จาก 5 ดาว">
      ${starSVG()} <strong>${c.rating.toFixed(1)}</strong>
      <span style="color:var(--muted)">(${c.ratingsCount.toLocaleString()})</span>
    </span>
  `;
  const price = `
    <div class="price">
      <span class="now">฿${c.price.toLocaleString()}</span>
      ${c.oldPrice?`<span class="old">฿${c.oldPrice.toLocaleString()}</span>`:''}
    </div>
  `;
  const tags = (c.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');

  // ✅ แสดงสถานะ Onsite / Online + รายละเอียด
  const modes = (c.modes||[]).map(m=>`
    <span class="mode">
      ${m.type==="Onsite" ? "🏫" : "💻"} ${m.type}
      <span class="detail">· ${m.detail}</span>
    </span>
  `).join('');

  return `
    <article class="card">
      <div class="thumb">
        <img src="${c.thumbnail}" alt="ภาพตัวอย่างคอร์ส: ${c.title}">
        ${c.badge?`<span class="badge">${c.badge}</span>`:''}
      </div>
      <div class="card-body">
        <div class="title">${c.title}</div>
        <div class="meta">
          <span>👩‍🏫 ${c.instructor}</span>
          <span>🗂️ ${c.category}</span>
          <span>⏱️ ${c.duration}</span>
        </div>
        <div class="modes">${modes}</div> <!-- สถานะคอร์ส -->
        ${rating}
        <div class="tags">${tags}</div>
        ${price}
        <div class="cta">
          <button class="btn primary" aria-label="ดูรายละเอียดคอร์ส ${c.title}">รายละเอียด</button>
          <button class="btn ghost" aria-label="บันทึกคอร์ส ${c.title}">บันทึก</button>
        </div>
      </div>
    </article>
  `;
}

function render(){
  const f = filtered();
  const pageItems = paginate(f);
  grid.innerHTML = pageItems.map(cardHTML).join('');
  empty.hidden = f.length>0;

  const maxPage = Math.max(1, Math.ceil(f.length/state.perPage));
  pageInfo.textContent = `หน้า ${Math.min(state.page,maxPage)} / ${maxPage}`;
  document.getElementById('prev').disabled = state.page<=1;
  document.getElementById('next').disabled = state.page>=maxPage;
}
render();

/** ====== Theme Toggle ====== **/
const themeBtn = document.getElementById('theme');
themeBtn.addEventListener('click', ()=>{
  const pressed = themeBtn.getAttribute('aria-pressed')==='true';
  themeBtn.setAttribute('aria-pressed', String(!pressed));
  document.documentElement.classList.toggle('light');
  if(document.documentElement.classList.contains('light')){
    document.documentElement.style.setProperty('--bg','#f7f8fb');
    document.documentElement.style.setProperty('--card','#ffffff');
    document.documentElement.style.setProperty('--text','#0d1321');
    document.documentElement.style.setProperty('--muted','#4b5563');
    document.documentElement.style.setProperty('--brand','#059669');
    document.documentElement.style.setProperty('--accent','#2563eb');
    document.documentElement.style.setProperty('--chip','#eef2ff');
    document.documentElement.style.setProperty('--chip-active','#e0e7ff');
    document.documentElement.style.setProperty('--border','#e5e7eb');
  }else{
    document.documentElement.style.setProperty('--bg','#0b0c0f');
    document.documentElement.style.setProperty('--card','#14161b');
    document.documentElement.style.setProperty('--text','#e8eaf0');
    document.documentElement.style.setProperty('--muted','#a9afbf');
    document.documentElement.style.setProperty('--brand','#6ee7b7');
    document.documentElement.style.setProperty('--accent','#60a5fa');
    document.documentElement.style.setProperty('--chip','#1d212a');
    document.documentElement.style.setProperty('--chip-active','#2a3342');
    document.documentElement.style.setProperty('--border','#232733');
  }
});
</script>
</body>
</html>
